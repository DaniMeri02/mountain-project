<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mountain Huts and Peaks Portal</title>
  <link rel="icon" href="data:,">
  
  <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css' rel='stylesheet' />
  
  <link href="./css/style.css" rel="stylesheet" />
</head>
<body>

  <header>
    <h1>Explore Huts and Peaks</h1>
  </header>
  
  <main>
    <div id='map-container'>
      <div id='map'></div>

      <div id='top-controls'>
        <div id='menu' class='menu'>
          <div class='menu-option'>
            <input id='outdoors-v12' type='radio' name='rtoggle' value='outdoors-v12' checked='checked'>
            <label for='outdoors-v12'>Outdoors</label>
          </div>
          <div class='menu-option'>
            <input id='satellite-streets-v12' type='radio' name='rtoggle' value='satellite-streets-v12'>
            <label for='satellite-streets-v12'>Satellite 2D</label>
          </div>
          <div class='menu-option'>
            <input id='satellite-3d' type='radio' name='rtoggle' value='satellite-streets-v12'>
            <label for='satellite-3d'>Satellite 3D</label>
          </div>
        </div>

        <div id='layer-toggles' class='menu'>
          <div class='menu-option'>
            <input id='toggle-trails' type='checkbox' checked='checked'>
            <label for='toggle-trails'>Trails Visibility</label>
          </div>
          <div class='menu-option'>
            <input id='toggle-ferrata' type='checkbox' checked='checked'>
            <label for='toggle-ferrata'>Via Ferrata Visibility</label>
          </div>
        </div>
        
        <!-- New Search System UI -->
        <div id='search-container'>
          <input type='text' id='search-box' placeholder='Search huts, peaks, bivouacs, via ferrata...' autocomplete='off' />
          <ul id='search-results'></ul>
        </div>
      </div>

      <button
        id='toggle-map-fullscreen'
        class='map-corner-btn'
        type='button'
        aria-pressed='false'
        aria-label='Enter fullscreen map mode'
        title='Enter fullscreen map mode'
      >
        ⛶
      </button>
    </div>
    <div id='panel'>
      <h2>Location Details</h2>
      <p>Select a location on the map to view more information here.</p>
    </div>
  </main>

  <script type="module" src="./js/main.js"></script>

</body>
</html>
